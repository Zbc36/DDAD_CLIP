Exp:
  out_dir: "output/AE/RSNA_CLIP_Only/"
  gpu: 3
  gpu_ids: [3]

Data:
  dataset: "rsna"
  img_size: 64
  clip_img_size: 336
  val_ratio: 0.1
  val_seed: 0
  workers: 12
  persistent_workers: true
  prefetch_factor: 4
  pin_memory: true
  cache_images: true
  synthetic_mode_probs:
    copy_paste: 0.4
    intensity_shift: 0.2
    blur_or_sharpen: 0.2
  synthetic_shape_probs:
    rectangle: 0.15
    ellipse: 0.25
    blob: 0.25
    multi_blob: 0.20
    streak: 0.15

CLIP:
  bs: 4
  val_bs: 4
  workers: 4
  val_workers: 2
  persistent_workers: true
  val_persistent_workers: false
  prefetch_factor: 2
  val_prefetch_factor: 2
  cache_images: true
  cache_clip_images: false
  lr: 1.0e-4
  weight_decay: 1.0e-4
  num_epoch: 10
  backbone_name: "ViT-L-14-336"
  pretrained: "openai"
  feature_layers: [6, 12, 18, 24]
  seg_adapter_dim: 512
  det_adapter_dim: 512
  prompt_ensemble: "vin_chest_xray"
  prompt_token_count: 4
  synthetic_probability: 0.5
  image_loss_weight: 1.0
  dice_loss_weight: 0.5
  amp: true
