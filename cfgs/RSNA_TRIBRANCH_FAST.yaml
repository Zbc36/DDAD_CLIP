Exp:
  out_dir: "output/TRIBRANCH/rsna_fast_ens3_128/"
  gpu: 1
  gpu_ids: [0, 1, 2, 3]

Ensemble:
  target_count: 3
  base_seed: 3407
  real_score_topk_ratio: 0.01

Model:
  network: "AE"  # AE, AE-U, MemAE
  mp: 1
  ls: 16
  mem_dim: Null
  shrink_thres: Null

Data:
  dataset: "rsna"
  img_size: 128
  clip_img_size: 224
  extra_data: 4000
  ar: 0.6
  val_ratio: 0.1
  val_seed: 0
  workers: 12
  persistent_workers: true
  prefetch_factor: 4
  pin_memory: true
  cache_images: true
  cache_safd_bands: true
  synthetic_mode_probs:
    copy_paste: 0.4
    intensity_shift: 0.2
    blur_or_sharpen: 0.2
    safd_band_swap: 0.2
  synthetic_shape_probs:
    rectangle: 0.15
    ellipse: 0.25
    blob: 0.25
    multi_blob: 0.20
    streak: 0.15

Solver:
  bs: 32
  lr: 5.0e-4
  weight_decay: 0
  num_epoch: 160

RefineSolver:
  bs: 8
  lr: 1.0e-4
  weight_decay: 1.0e-4
  num_epoch: 60
  grad_clip: Null

SAFD:
  n_levels: 12
  patch_size: 4
  lambda_repulsion: 1.0e-8

SAFDAblation:
  enable_data_safd_swap: true
  enable_recon_band_maps: true
  enable_clip_prior: true
  enable_clip_post: false
  enable_fusion_output_refine: false
  clip_post_strength: 0.5
  fusion_output_strength: 0.5

Diffusion:
  bs: 64
  val_bs: 16
  lr: 1.0e-4
  weight_decay: 0.0
  num_epoch: 40
  base_channels: 64
  time_dim: 128
  num_steps: 1000
  beta_start: 1.0e-4
  beta_end: 2.0e-2
  t_recon: 100
  ddim_steps: 20
  workers: 8
  persistent_workers: true
  prefetch_factor: 2
  cache_images: true
  cache_safd_bands: false
  amp: true

CLIP:
  bs: 8
  val_bs: 8
  workers: 4
  val_workers: 2
  persistent_workers: true
  val_persistent_workers: false
  prefetch_factor: 2
  val_prefetch_factor: 2
  cache_images: true
  cache_clip_images: true
  cache_safd_bands: false
  lr: 1.0e-4
  weight_decay: 1.0e-4
  num_epoch: 15
  backbone_name: "ViT-B-16"
  pretrained: "openai"
  feature_layers: [3, 6, 9, 12]
  seg_adapter_dim: 512
  det_adapter_dim: 512
  prompt_ensemble: "rsna_chest_xray"
  prompt_token_count: 4
  synthetic_probability: 0.5
  image_loss_weight: 1.0
  dice_loss_weight: 0.5
  safd_prior_strength: 0.5
  amp: true

Fusion:
  bs: 16
  val_bs: 8
  cache_bs: 16
  cache_eval_bs: 8
  lr: 3.0e-5
  weight_decay: 1.0e-4
  num_epoch: 15
  base_channels: 32
  in_channels: 9
  synthetic_probability: 0.5
  image_loss_weight: 0.3
  dice_loss_weight: 0.5
  iou_loss_weight: 0.25
  amp: true
  grad_clip: 1.0
  use_cached_features: true
  cache_seed: 3407
  cache_loader_workers: 8
  cache_loader_persistent_workers: true
  cache_loader_prefetch_factor: 2
  vis_threshold: 0.5
  min_region_area: 64
  max_region_area_ratio: 0.45
  peak_split_threshold_ratio: 0.7
  box_nms_iou: 0.3
  max_boxes: 3
  export_seed: 3407
  export_num_images: 20
